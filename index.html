
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aurora TV</title>
<style>
/* =====================================================================
   AURORA TV  -  Minimal futuristic / Liquid Glass home screen
   Written for 2016-era Samsung (Tizen) browsers: prefixed properties,
   flexbox only (no grid), no CSS variables, graceful fallbacks.
   ===================================================================== */

/* ---------- Base ---------- */
html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; overflow: hidden; }
body { font-family: "Helvetica Neue", Helvetica, Arial, "Segoe UI", Roboto, sans-serif; color: #fff; }

#stage {
  position: absolute; left: 50%; top: 50%;
  width: 1920px; height: 1080px; margin-left: -960px; margin-top: -540px;
  overflow: hidden; background: #05060a;
  -webkit-transform-origin: 50% 50%; transform-origin: 50% 50%;
  opacity: 0; -webkit-transition: opacity .9s ease; transition: opacity .9s ease;
}
#stage.ready { opacity: 1; }

/* ---------- Wallpaper layers (cross-fade) ---------- */
.wall {
  position: absolute; left: 0; top: 0; width: 1920px; height: 1080px;
  background-size: cover; background-position: center center; background-repeat: no-repeat;
  opacity: 0; -webkit-transition: opacity 1.4s ease; transition: opacity 1.4s ease;
}
.wall.on { opacity: 1; }
#scrim {
  position: absolute; left: 0; top: 0; width: 1920px; height: 1080px;
  background: rgba(3,4,10,.5);
  background: -webkit-linear-gradient(top, rgba(3,4,10,.30) 0%, rgba(3,4,10,.72) 100%);
  background: linear-gradient(to bottom, rgba(3,4,10,.30) 0%, rgba(3,4,10,.72) 100%);
}

/* ---------- Ambient accent glow (follows focused tile) ---------- */
.glow {
  position: absolute; right: -380px; top: -420px; width: 1500px; height: 1300px; opacity: 0;
  -webkit-transition: opacity 1.2s ease; transition: opacity 1.2s ease;
}
.glow.on { opacity: 1; }

/* ---------- Animated effects: aurora blobs + particles ---------- */
#fx { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; overflow: hidden; }
body.fx-off #fx { display: none; }
.blob { position: absolute; border-radius: 50%; opacity: .55; }
.b1 { left: -320px; top: -360px; width: 1100px; height: 1100px;
  background: -webkit-radial-gradient(center, rgba(90,110,255,.50) 0%, rgba(90,110,255,0) 66%);
  background: radial-gradient(circle at center, rgba(90,110,255,.50) 0%, rgba(90,110,255,0) 66%);
  -webkit-animation: drift1 52s ease-in-out infinite alternate; animation: drift1 52s ease-in-out infinite alternate; }
.b2 { right: -340px; bottom: -420px; width: 1200px; height: 1200px;
  background: -webkit-radial-gradient(center, rgba(160,90,255,.44) 0%, rgba(160,90,255,0) 66%);
  background: radial-gradient(circle at center, rgba(160,90,255,.44) 0%, rgba(160,90,255,0) 66%);
  -webkit-animation: drift2 64s ease-in-out infinite alternate; animation: drift2 64s ease-in-out infinite alternate; }
.b3 { left: 640px; top: 280px; width: 800px; height: 800px; opacity: .4;
  background: -webkit-radial-gradient(center, rgba(120,210,255,.30) 0%, rgba(120,210,255,0) 66%);
  background: radial-gradient(circle at center, rgba(120,210,255,.30) 0%, rgba(120,210,255,0) 66%);
  -webkit-animation: drift3 78s ease-in-out infinite alternate; animation: drift3 78s ease-in-out infinite alternate; }
#pts { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; }
.pt {
  position: absolute; bottom: -30px; border-radius: 50%; opacity: 0;
  background: -webkit-radial-gradient(center, rgba(255,255,255,.95) 0%, rgba(160,175,255,.5) 40%, rgba(160,175,255,0) 72%);
  background: radial-gradient(circle at center, rgba(255,255,255,.95) 0%, rgba(160,175,255,.5) 40%, rgba(160,175,255,0) 72%);
  -webkit-animation: floatUp 30s linear infinite; animation: floatUp 30s linear infinite;
}

@-webkit-keyframes drift1 { from { -webkit-transform: translate(0,0) scale(1); } to { -webkit-transform: translate(280px,200px) scale(1.15); } }
@keyframes drift1 { from { transform: translate(0,0) scale(1); } to { transform: translate(280px,200px) scale(1.15); } }
@-webkit-keyframes drift2 { from { -webkit-transform: translate(0,0) scale(1.1); } to { -webkit-transform: translate(-300px,-160px) scale(.95); } }
@keyframes drift2 { from { transform: translate(0,0) scale(1.1); } to { transform: translate(-300px,-160px) scale(.95); } }
@-webkit-keyframes drift3 { from { -webkit-transform: translate(-160px,60px) scale(.9); } to { -webkit-transform: translate(220px,-120px) scale(1.2); } }
@keyframes drift3 { from { transform: translate(-160px,60px) scale(.9); } to { transform: translate(220px,-120px) scale(1.2); } }
@-webkit-keyframes floatUp {
  0% { opacity: 0; -webkit-transform: translate(0,0); }
  10% { opacity: .85; }
  90% { opacity: .55; }
  100% { opacity: 0; -webkit-transform: translate(70px,-1160px); }
}
@keyframes floatUp {
  0% { opacity: 0; transform: translate(0,0); }
  10% { opacity: .85; }
  90% { opacity: .55; }
  100% { opacity: 0; transform: translate(70px,-1160px); }
}
@-webkit-keyframes rise { from { opacity: 0; -webkit-transform: translateY(36px); } to { opacity: 1; -webkit-transform: translateY(0); } }
@keyframes rise { from { opacity: 0; transform: translateY(36px); } to { opacity: 1; transform: translateY(0); } }
@-webkit-keyframes spin { to { -webkit-transform: rotate(360deg); } }
@keyframes spin { to { transform: rotate(360deg); } }

/* ---------- Liquid glass ----------
   Fallback first (solid-ish translucent), then real frosted glass where
   backdrop-filter is supported.                                          */
.glass {
  position: relative;
  background: rgba(30,34,52,.78);
  border: 1px solid rgba(255,255,255,.16);
  border-radius: 36px;
  box-shadow: inset 0 1px 0 rgba(255,255,255,.30), inset 0 -1px 0 rgba(255,255,255,.04), 0 30px 70px rgba(0,0,0,.45);
}
.glass:before {
  content: ""; position: absolute; left: 0; top: 0; right: 0; height: 50%; border-radius: inherit; pointer-events: none;
  background: -webkit-linear-gradient(top, rgba(255,255,255,.14), rgba(255,255,255,0));
  background: linear-gradient(to bottom, rgba(255,255,255,.14), rgba(255,255,255,0));
}
@supports ((-webkit-backdrop-filter: blur(1px)) or (backdrop-filter: blur(1px))) {
  .glass {
    background: rgba(255,255,255,.08);
    -webkit-backdrop-filter: blur(30px) saturate(160%); backdrop-filter: blur(30px) saturate(160%);
  }
}

/* ---------- Rows / scrolling ---------- */
#rows { position: absolute; left: 0; top: 0; width: 1920px; height: 1000px; overflow: hidden; z-index: 2; }
#rowsInner {
  position: relative; width: 1920px;
  -webkit-transition: -webkit-transform .6s cubic-bezier(.2,.7,.2,1); transition: transform .6s cubic-bezier(.2,.7,.2,1);
}
.row { position: relative; padding-bottom: 30px; opacity: .6; -webkit-transition: opacity .35s ease; transition: opacity .35s ease; }
.row.active, .row.hero { opacity: 1; }
.rowTitle { margin: 0 0 0 110px; height: 46px; line-height: 46px; font-size: 34px; font-weight: 500; letter-spacing: 1px; color: rgba(255,255,255,.92); }
.track {
  position: relative; display: -webkit-flex; display: flex; padding: 20px 0 20px 110px;
  -webkit-transition: -webkit-transform .42s cubic-bezier(.2,.7,.2,1); transition: transform .42s cubic-bezier(.2,.7,.2,1);
}

/* ---------- Home hero: clock + spotlight ---------- */
.hero { height: 470px; }
#hello { position: absolute; left: 114px; top: 76px; font-size: 28px; letter-spacing: 8px; text-transform: uppercase; color: rgba(255,255,255,.62); }
#clock { position: absolute; left: 100px; top: 108px; white-space: nowrap; font-size: 210px; font-weight: 200; line-height: 222px; letter-spacing: -4px; text-shadow: 0 0 70px rgba(130,150,255,.40); }
#clkS { font-size: 68px; letter-spacing: 0; color: rgba(255,255,255,.55); margin-left: 8px; }
#date { position: absolute; left: 114px; top: 338px; font-size: 42px; font-weight: 300; letter-spacing: 1px; color: rgba(255,255,255,.80); }

#spot { position: absolute; left: 1010px; top: 70px; width: 800px; height: 350px; border-radius: 42px; overflow: hidden; }
#spotTint { position: absolute; left: 0; top: 0; right: 0; bottom: 0; -webkit-transition: opacity .35s ease; transition: opacity .35s ease; }
#spotText { position: absolute; left: 48px; top: 36px; width: 704px; z-index: 2; -webkit-transition: opacity .35s ease, -webkit-transform .35s ease; transition: opacity .35s ease, transform .35s ease; }
#spotText.out, #spotTint.out { opacity: 0; }
#spotText.out { -webkit-transform: translateX(-22px); transform: translateX(-22px); }
#spotTag { display: inline-block; padding: 5px 18px; border-radius: 20px; font-size: 22px; font-weight: 600; letter-spacing: 3px; background: rgba(255,255,255,.16); border: 1px solid rgba(255,255,255,.22); }
#spotTitle { font-size: 60px; font-weight: 600; letter-spacing: -1px; line-height: 76px; margin-top: 8px; }
#spotMeta { font-size: 24px; color: rgba(255,255,255,.66); margin: 2px 0 10px 0; }
#spotDesc { font-size: 26px; line-height: 36px; color: rgba(255,255,255,.84); height: 72px; overflow: hidden; }
#spotBtns { position: absolute; left: 48px; bottom: 36px; display: -webkit-flex; display: flex; z-index: 2; }
#dots { position: absolute; right: 40px; top: 46px; z-index: 2; font-size: 0; }
#dots i { display: inline-block; width: 12px; height: 12px; border-radius: 6px; margin-left: 10px; background: rgba(255,255,255,.3); -webkit-transition: width .3s, background .3s; transition: width .3s, background .3s; }
#dots i.on { width: 36px; background: #fff; }

.btn {
  position: relative; -webkit-box-sizing: border-box; box-sizing: border-box; height: 68px; line-height: 66px; padding: 0 40px; margin-right: 22px;
  border-radius: 34px; font-size: 28px; font-weight: 600; white-space: nowrap;
  -webkit-transition: -webkit-transform .28s ease; transition: transform .28s ease;
}
#btnPlay { background: #fff; color: #0a0d16; border: 1px solid #fff; }
#btnList { background: rgba(255,255,255,.14); border: 1px solid rgba(255,255,255,.30); color: #fff; }
.btn.focused { -webkit-transform: scale(1.08); transform: scale(1.08); }

/* ---------- Focus ring (opacity only = cheap) ---------- */
.ring {
  position: absolute; left: -7px; top: -7px; right: -7px; bottom: -7px;
  border: 3px solid #fff; border-radius: 41px; opacity: 0; pointer-events: none;
  box-shadow: 0 0 34px rgba(120,150,255,.75), 0 0 80px rgba(160,100,255,.40);
  -webkit-transition: opacity .22s ease; transition: opacity .22s ease;
}
.focused > .ring { opacity: 1; }

/* ---------- Tiles (faux glass, no backdrop-filter = fast) ---------- */
.tile {
  position: relative; margin-right: 30px; -webkit-flex-shrink: 0; flex-shrink: 0; border-radius: 34px;
  -webkit-transition: -webkit-transform .3s cubic-bezier(.2,.8,.2,1); transition: transform .3s cubic-bezier(.2,.8,.2,1);
  -webkit-animation: rise .7s ease backwards; animation: rise .7s ease backwards;
}
.tile.focused { -webkit-transform: scale(1.08); transform: scale(1.08); }
.face {
  position: absolute; left: 0; top: 0; right: 0; bottom: 0; border-radius: 34px; overflow: hidden;
  background: rgba(40,45,66,.72); border: 1px solid rgba(255,255,255,.17);
  box-shadow: inset 0 1px 0 rgba(255,255,255,.32), 0 18px 40px rgba(0,0,0,.40);
}
.face:after {
  content: ""; position: absolute; left: 0; top: 0; right: 0; bottom: 0; pointer-events: none;
  background: -webkit-linear-gradient(top, rgba(255,255,255,.18), rgba(255,255,255,0) 48%);
  background: linear-gradient(to bottom, rgba(255,255,255,.18), rgba(255,255,255,0) 48%);
}
.acc { position: absolute; left: -70px; top: -90px; width: 300px; height: 300px; border-radius: 150px; }

.badge {
  position: absolute; display: -webkit-flex; display: flex; -webkit-align-items: center; align-items: center; -webkit-justify-content: center; justify-content: center;
  -webkit-box-sizing: border-box; box-sizing: border-box; border: 1px solid rgba(255,255,255,.32);
  box-shadow: inset 0 1px 0 rgba(255,255,255,.35), 0 8px 22px rgba(0,0,0,.30); z-index: 2; color: #fff;
}
.badge svg { width: 46px; height: 46px; display: block; }
.badge .ltr { font-size: 42px; font-weight: 600; line-height: 1; }

.app { width: 300px; height: 200px; }
.app .badge { left: 28px; top: 26px; width: 76px; height: 76px; border-radius: 24px; }
.app .name { position: absolute; left: 30px; right: 20px; bottom: 50px; font-size: 34px; font-weight: 500; letter-spacing: .3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; z-index: 2; }
.app .host { position: absolute; left: 30px; right: 20px; bottom: 22px; font-size: 22px; color: rgba(255,255,255,.55); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; z-index: 2; }

.watch { width: 420px; height: 236px; }
.watch .orb { position: absolute; width: 300px; height: 300px; border-radius: 150px; right: -90px; top: -120px; background: rgba(255,255,255,.12); }
.watch .shade { position: absolute; left: 0; right: 0; bottom: 0; height: 160px;
  background: -webkit-linear-gradient(top, rgba(0,0,0,0), rgba(0,0,0,.6)); background: linear-gradient(to bottom, rgba(0,0,0,0), rgba(0,0,0,.6)); }
.watch .play { position: absolute; right: 24px; top: 22px; width: 62px; height: 62px; border-radius: 31px; background: rgba(255,255,255,.18); border: 1px solid rgba(255,255,255,.35); z-index: 2; }
.watch .play:before { content: ""; position: absolute; left: 24px; top: 17px; border-left: 20px solid #fff; border-top: 12px solid transparent; border-bottom: 12px solid transparent; }
.watch .title { position: absolute; left: 28px; right: 24px; bottom: 72px; font-size: 34px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; z-index: 2; text-shadow: 0 2px 10px rgba(0,0,0,.5); }
.watch .sub { position: absolute; left: 28px; bottom: 42px; font-size: 22px; color: rgba(255,255,255,.82); z-index: 2; }
.watch .bar { position: absolute; left: 28px; right: 28px; bottom: 24px; height: 6px; border-radius: 3px; background: rgba(255,255,255,.26); z-index: 2; }
.watch .bar i { display: block; height: 6px; border-radius: 3px; background: #fff; box-shadow: 0 0 12px rgba(255,255,255,.8); }

.sys { width: 300px; height: 110px; border-radius: 55px; }
.sys .face { border-radius: 55px; background: rgba(255,255,255,.09); }
.sys.focused .face { background: rgba(255,255,255,.2); }
.sys .ring { border-radius: 62px; }
.sys .badge { left: 22px; top: 22px; width: 66px; height: 66px; border-radius: 33px; }
.sys .badge svg { width: 34px; height: 34px; }
.sys .name { position: absolute; left: 108px; right: 16px; top: 0; height: 110px; line-height: 110px; font-size: 28px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; z-index: 2; }

/* ---------- Mini clock, hint bar, toast ---------- */
#mini {
  position: absolute; right: 80px; top: 34px; z-index: 5; padding: 8px 34px; border-radius: 40px; font-size: 38px; font-weight: 300; letter-spacing: 2px;
  opacity: 0; -webkit-transform: translateY(-14px); transform: translateY(-14px);
  -webkit-transition: opacity .35s ease, -webkit-transform .35s ease; transition: opacity .35s ease, transform .35s ease;
}
#mini.on { opacity: 1; -webkit-transform: translateY(0); transform: translateY(0); }
#hint { position: absolute; left: 0; bottom: 26px; width: 1920px; text-align: center; font-size: 22px; letter-spacing: 1px; color: rgba(255,255,255,.5); z-index: 6; }
#hint b { color: #fff; font-weight: 600; padding: 0 6px; }
#hint span { margin: 0 24px; }
#toast {
  position: absolute; left: 50%; bottom: 100px; width: 700px; margin-left: -350px; padding: 20px 0; text-align: center; z-index: 50;
  border-radius: 40px; background: rgba(28,32,48,.95); border: 1px solid rgba(255,255,255,.2); font-size: 28px; font-weight: 500;
  box-shadow: 0 16px 40px rgba(0,0,0,.5);
  opacity: 0; -webkit-transform: translateY(20px); transform: translateY(20px);
  -webkit-transition: opacity .3s ease, -webkit-transform .3s ease; transition: opacity .3s ease, transform .3s ease;
}
#toast.show { opacity: 1; -webkit-transform: translateY(0); transform: translateY(0); }

/* ---------- Launch overlay ---------- */
#launch {
  position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; z-index: 40; background: rgba(4,5,10,.9); opacity: 0; visibility: hidden;
  -webkit-transition: opacity .3s ease, visibility .3s; transition: opacity .3s ease, visibility .3s;
  display: -webkit-flex; display: flex; -webkit-align-items: center; align-items: center; -webkit-justify-content: center; justify-content: center;
}
#launch.show { opacity: 1; visibility: visible; }
#launch .box {
  width: 660px; padding: 56px 0 52px 0; text-align: center; border-radius: 60px;
  -webkit-transform: scale(.9); transform: scale(.9); -webkit-transition: -webkit-transform .4s cubic-bezier(.2,.8,.2,1); transition: transform .4s cubic-bezier(.2,.8,.2,1);
}
#launch.show .box { -webkit-transform: scale(1); transform: scale(1); }
#lBadge { position: relative; width: 168px; height: 168px; margin: 0 auto 34px auto; border-radius: 52px; }
#lBadge svg { width: 88px; height: 88px; }
#lBadge .ltr { font-size: 84px; }
#lName { font-size: 58px; font-weight: 600; letter-spacing: -.5px; padding: 0 30px; }
#lSub { font-size: 28px; color: rgba(255,255,255,.65); margin-top: 10px; padding: 0 30px; }
.spinner { width: 50px; height: 50px; margin: 40px auto 0 auto; border: 5px solid rgba(255,255,255,.2); border-top-color: #fff; border-radius: 50%;
  -webkit-animation: spin .9s linear infinite; animation: spin .9s linear infinite; }

/* ---------- Settings panels (wallpaper + app editor) ---------- */
#panelLayer {
  position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; z-index: 30; background: rgba(2,3,8,.42); opacity: 0; visibility: hidden;
  -webkit-transition: opacity .3s ease, visibility .3s; transition: opacity .3s ease, visibility .3s;
}
#panelLayer.show { opacity: 1; visibility: visible; }
#panel { position: absolute; overflow: hidden; -webkit-box-sizing: border-box; box-sizing: border-box; }
#panel.p-wall { left: 80px; right: 80px; bottom: 40px; height: 660px; }
#panel.p-apps { left: 200px; top: 70px; width: 1520px; height: 940px; }
.pTitle { position: absolute; left: 56px; top: 34px; font-size: 44px; font-weight: 600; letter-spacing: -.5px; z-index: 2; }
.pSub { position: absolute; left: 56px; top: 92px; font-size: 24px; color: rgba(255,255,255,.62); z-index: 2; }
.pNote { position: absolute; left: 56px; right: 56px; font-size: 22px; line-height: 30px; color: rgba(255,255,255,.5); z-index: 2; }

.pf {
  position: relative; -webkit-box-sizing: border-box; box-sizing: border-box; background: rgba(255,255,255,.10); border: 1px solid rgba(255,255,255,.22);
  border-radius: 26px; color: #fff; font-size: 28px; font-weight: 500; text-align: center;
  -webkit-transition: background .2s ease, box-shadow .2s ease; transition: background .2s ease, box-shadow .2s ease;
}
.pf.focused { background: rgba(255,255,255,.26); box-shadow: 0 0 0 4px #fff, 0 0 36px rgba(130,150,255,.75); }
.btnp { display: inline-block; height: 76px; line-height: 74px; padding: 0 38px; margin-right: 18px; border-radius: 38px; }
.field { display: inline-block; height: 76px; text-align: left; border-radius: 26px; }
.field.editing { background: rgba(255,255,255,.34); }
.field input {
  display: block; width: 100%; height: 100%; margin: 0; padding: 0 24px; border: 0; outline: 0; background: transparent; color: #fff;
  font-family: inherit; font-size: 27px; -webkit-box-sizing: border-box; box-sizing: border-box;
}
.field input::-webkit-input-placeholder { color: rgba(255,255,255,.38); }
.field input::placeholder { color: rgba(255,255,255,.38); }
.pRow { position: absolute; left: 56px; display: -webkit-flex; display: flex; z-index: 2; }

.strip { position: absolute; left: 0; right: 0; top: 134px; height: 236px; overflow: hidden; z-index: 2; }
.stripIn { position: relative; display: -webkit-flex; display: flex; padding: 30px 0 30px 56px; -webkit-transition: -webkit-transform .35s ease; transition: -webkit-transform .35s ease; transition: transform .35s ease; }
.thumb {
  position: relative; width: 300px; height: 170px; margin-right: 24px; -webkit-flex-shrink: 0; flex-shrink: 0; border-radius: 26px; overflow: hidden;
  background-size: cover; background-position: center center; border: 1px solid rgba(255,255,255,.22);
  -webkit-transition: -webkit-transform .25s ease, box-shadow .25s ease; transition: transform .25s ease, box-shadow .25s ease;
}
.thumb.focused { -webkit-transform: scale(1.06); transform: scale(1.06); box-shadow: 0 0 0 4px #fff, 0 0 40px rgba(130,150,255,.75); }
.thumb .tl { position: absolute; left: 0; right: 0; bottom: 0; padding: 22px 16px 10px 16px; font-size: 22px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  background: -webkit-linear-gradient(top, rgba(0,0,0,0), rgba(0,0,0,.7)); background: linear-gradient(to bottom, rgba(0,0,0,0), rgba(0,0,0,.7)); }
.thumb .tick { display: none; position: absolute; right: 12px; top: 12px; width: 38px; height: 38px; border-radius: 19px; background: rgba(255,255,255,.95); }
.thumb .tick svg { width: 24px; height: 24px; margin: 7px; display: block; }

.pBody { position: absolute; left: 0; right: 0; top: 136px; height: 640px; overflow: hidden; z-index: 2; }
.pScroll { position: relative; padding: 8px 56px 8px 56px; -webkit-transition: -webkit-transform .3s ease; transition: -webkit-transform .3s ease; transition: transform .3s ease; }
.arow { display: -webkit-flex; display: flex; height: 76px; margin-bottom: 20px; }
.arow .pf { margin-right: 16px; }
.ibtn { width: 76px; height: 76px; padding: 0; }
.ibtn svg { width: 34px; height: 34px; margin: 20px; display: block; }
.pFoot { position: absolute; left: 56px; top: 804px; display: -webkit-flex; display: flex; z-index: 2; }
</style>
</head>
<body>
<div id="stage">
  <!-- Wallpapers + atmosphere -->
  <div class="wall" id="wallA"></div>
  <div class="wall" id="wallB"></div>
  <div id="scrim"></div>
  <div class="glow" id="glowA"></div>
  <div class="glow" id="glowB"></div>
  <div id="fx"><div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div><div id="pts"></div></div>

  <!-- Home content -->
  <div id="rows">
    <div id="rowsInner">
      <div class="row hero" id="rowHero">
        <div id="hello"></div>
        <div id="clock"><span id="clkHM">00:00</span><span id="clkS">:00</span></div>
        <div id="date"></div>

        <div id="spot" class="glass">
          <div id="spotTint"></div>
          <div id="spotText">
            <div id="spotTag"></div>

      face = mk("div", "face"); el.appendChild(face);
      badge = mk("div", "badge"); setBadge(badge, { icon: s.icon, c: s.c });
      nm = mk("div", "name"); nm.textContent = s.name;
      el.appendChild(badge); el.appendChild(nm);
      item = addItem(rSys, el, "sys", s, s.c);
      item.nameEl = nm;
    }
  })();

  function updateFxLabel() {
    var i;
    for (i = 0; i < rSys.items.length; i++) {
      if (rSys.items[i].data.kind === "fx") { rSys.items[i].nameEl.textContent = "Effects: " + (fxOn ? "On" : "Off"); }
    }
  }
  function toggleFx() {
    fxOn = !fxOn; applyFx(); save("fx", fxOn); updateFxLabel();
    toast("Animated effects " + (fxOn ? "on" : "off"));
  }

  buildApps();
  updateFxLabel();

  /* =====================================================================
     Spotlight rotation
     ===================================================================== */
  var heroIdx = 0, heroTimer = null, dotsEl = $("dots"), i0;
  for (i0 = 0; i0 < HERO.length; i0++) { dotsEl.appendChild(document.createElement("i")); }

  function paintHero(n) {
    var h = HERO[n], d = dotsEl.childNodes, k;
    $("spotTag").textContent = h.badge;
    $("spotTitle").textContent = h.title;
    $("spotMeta").textContent = h.meta;
    $("spotDesc").textContent = h.desc;
    setBG($("spotTint"), "radial-gradient(ellipse at 100% 0%, " + rgba(h.c1, .55) + " 0%, rgba(0,0,0,0) 62%)");
    for (k = 0; k < d.length; k++) { d[k].className = (k === n) ? "on" : ""; }
    if (cur.r === 0) { setGlow(h.c1); }
  }
  function setHero(n) {
    heroIdx = n;
    $("spotText").className = "out"; $("spotTint").className = "out";
    setTimeout(function () { paintHero(n); $("spotText").className = ""; $("spotTint").className = ""; }, 350);
  }
  function startHero() {
    clearInterval(heroTimer);
    heroTimer = setInterval(function () { setHero((heroIdx + 1) % HERO.length); }, 9000);
  }

  /* =====================================================================
     Focus + scrolling on the home screen
     ===================================================================== */
  function scrollRow(r) {
    var y = r === 0 ? 0 : rows[1].el.offsetTop - 50;
    setT(inner, "translateY(" + (-y) + "px)");
    if (r > 0) { addC($("mini"), "on"); } else { remC($("mini"), "on"); }
  }
  function scrollTrack(r, i) {
    var row = rows[r];
    if (!row.track) { return; }
    var it = row.items[i].el, off = row.off || 0, left = it.offsetLeft, right = left + it.offsetWidth;
    if (right - off > 1810) { off = right - 1810; }
    if (left - off < 110) { off = left - 110; }
    if (off < 0) { off = 0; }
    row.off = off;
    setT(row.track, "translateX(" + (-off) + "px)");
  }
  function setFocus(r, i) {
    var old = rows[cur.r].items[cur.i], k;
    if (old) { remC(old.el, "focused"); }
    for (k = 0; k < rows.length; k++) { remC(rows[k].el, "active"); }
    cur.r = r; cur.i = i;
    rows[r].idx = i;
    var it = rows[r].items[i];
    addC(it.el, "focused");
    if (!rows[r].hero) { addC(rows[r].el, "active"); }
    scrollRow(r);
    scrollTrack(r, i);
    setGlow(it.color || HERO[heroIdx].c1);
  }

  /* =====================================================================
     Launch overlay + actions
     ===================================================================== */
  var launchEl = $("launch"), launching = false, launchTimer = null;

  function openLaunch(name, sub, color, spec, url) {
    launching = true;
    setBadge($("lBadge"), { icon: spec.icon, ch: spec.ch, name: name, c: color });
    $("lName").textContent = name;
    $("lSub").textContent = sub;
    launchEl.className = "show";
    clearTimeout(launchTimer);
    if (url) {
      launchTimer = setTimeout(function () {
        window.location.href = url;
        launchTimer = setTimeout(closeLaunch, 7000);
      }, 900);
    } else {
      launchTimer = setTimeout(closeLaunch, 2600);
    }
  }
  function closeLaunch() {
    clearTimeout(launchTimer);
    launchEl.className = "";
    launching = false;
  }
  function launchApp(a) {
    var url = normUrl(a.url);
    function web() {
      if (!url) { toast("No link set for " + a.name); return; }
      openLaunch(a.name, "Opening " + hostOf(url) + "\u2026", a.c, a, url);
    }
    if (a.appId && window.tizen && window.tizen.application) {
      try { window.tizen.application.launch(a.appId, null, web); return; } catch (e) {}
    }
    web();
  }
  function activate() {
    var it = rows[cur.r].items[cur.i], d = it.data;
    if (it.type === "play") {
      var h = HERO[heroIdx];
      openLaunch(h.title, "Starting playback\u2026", h.c1, { icon: "play" }, null);
    } else if (it.type === "list") {
      toast("Added \u201C" + HERO[heroIdx].title + "\u201D to My List");
    } else if (it.type === "app") {
      launchApp(d);
    } else if (it.type === "watch") {
      openLaunch(d.title, "Resuming where you left off\u2026", d.c1, { icon: "play" }, null);
    } else if (it.type === "sys") {
      if (d.kind === "wall") { openPanel("wall"); }
      else if (d.kind === "apps") { openPanel("apps"); }
      else if (d.kind === "fx") { toggleFx(); }
      else { openLaunch(d.name, d.sub, d.c, { icon: d.icon }, null); }
    }
  }

  /* =====================================================================
     Settings panels (virtual focus model so it works with any remote)
     ===================================================================== */
  var panelLayer = $("panelLayer"), panelEl = $("panel");
  var P = { open: false, kind: "", rows: [], r: 0, c: 0, editing: null, scrollEl: null, scrollY: 0, strip: null, stripOff: 0 };

  function pfAt(r, c) { return P.rows[r] ? P.rows[r][c] : null; }
  function addPF(rowIdx, el, f) {
    if (!P.rows[rowIdx]) { P.rows[rowIdx] = []; }
    f.el = el;
    P.rows[rowIdx].push(f);
    var c = P.rows[rowIdx].length - 1;
    el.onclick = function () { setPF(rowIdx, c); if (f.act) { f.act(); } };
  }
  function setPF(r, c) {
    var old = pfAt(P.r, P.c);
    if (old) { remC(old.el, "focused"); }
    if (r >= P.rows.length) { r = P.rows.length - 1; }
    if (r < 0) { r = 0; }
    if (c >= P.rows[r].length) { c = P.rows[r].length - 1; }
    if (c < 0) { c = 0; }
    P.r = r; P.c = c;
    var f = P.rows[r][c];
    addC(f.el, "focused");
    if (f.onfocus) { f.onfocus(); }
  }
  function mkField(value, ph, w) {
    var wrap = mk("div", "pf field"), inp = document.createElement("input");
    inp.type = "text"; inp.value = value; inp.placeholder = ph;
    inp.setAttribute("autocomplete", "off"); inp.setAttribute("autocapitalize", "off"); inp.setAttribute("spellcheck", "false");
    wrap.style.width = w + "px";
    wrap.appendChild(inp);
    inp.onfocus = function () { P.editing = inp; addC(wrap, "editing"); };
    inp.onblur = function () { if (P.editing === inp) { P.editing = null; } remC(wrap, "editing"); };
    return { wrap: wrap, input: inp };
  }
  function mkIcon(name) { return mk("div", "pf ibtn", svg(name)); }
  function mkBtn(label) { return mk("div", "pf btnp", label); }

  function scrollStrip(el) {
    var off = P.stripOff || 0, left = el.offsetLeft, right = left + el.offsetWidth;
    if (right - off > 1704) { off = right - 1704; }
    if (left - off < 56) { off = left - 56; }
    if (off < 0) { off = 0; }
    P.stripOff = off;
    setT(P.strip, "translateX(" + (-off) + "px)");
  }
  function ensureRowVisible(rowEl) {
    var top = rowEl.offsetTop, h = rowEl.offsetHeight + 20, vh = 640, y = P.scrollY || 0;
    if (top < y) { y = top; }
    if (top + h > y + vh) { y = top + h - vh; }
    if (y < 0) { y = 0; }
    P.scrollY = y;
    setT(P.scrollEl, "translateY(" + (-y) + "px)");
  }
  function refreshTicks() {
    if (!P.open || P.kind !== "wall" || !P.rows[0]) { return; }
    var i, f;
    for (i = 0; i < P.rows[0].length; i++) {
      f = P.rows[0][i];
      f.tick.style.display = (f.wid === wallId) ? "block" : "none";
    }
  }
  function nameFromUrl(u) {
    var s = String(u).split("?")[0].split("#")[0], parts = s.split("/"), n = parts[parts.length - 1] || parts[parts.length - 2] || "Custom";
    n = n.replace(/\.[a-z0-9]{2,5}$/i, "");
    return n.length > 22 ? n.substr(0, 22) : (n || "Custom");
  }
  function addCustomWall(name, url) {
    var id = "c" + (new Date().getTime());
    customWalls.push({ id: id, name: name, url: url, base: "#05060a" });
    return id;
  }

  /* ----- Wallpaper panel ----- */
  function buildWallPanel() {
    panelEl.appendChild(mk("div", "pTitle", "Wallpaper"));
    panelEl.appendChild(mk("div", "pSub", "Pick a background, or add your own from an image link or file."));

    var strip = mk("div", "strip"), inn = mk("div", "stripIn");
    strip.appendChild(inn); panelEl.appendChild(strip);
    P.strip = inn; P.stripOff = 0;

    var list = allWalls(), i;
    for (i = 0; i < list.length; i++) {
      (function (w) {
        var el = mk("div", "thumb"), lab = mk("div", "tl"), tick = mk("div", "tick", svg("check"));
        paintWall(el, w);
        lab.textContent = w.name;
        tick.firstChild.setAttribute("stroke", "#0a0d16");
        el.appendChild(lab); el.appendChild(tick);
        inn.appendChild(el);
        addPF(0, el, {
          wid: w.id, tick: tick,
          act: function () { setWallpaper(w.id, false); },
          onfocus: function () { scrollStrip(el); }
        });
      })(list[i]);
    }

    // Row 1: image URL
    var row1 = mk("div", "pRow"), uf = mkField("", "Image link, e.g. https://example.com/space.jpg", 1240);
    row1.style.top = "396px";
    row1.appendChild(uf.wrap);
    var addBtn = mkBtn("Add link"); addBtn.style.marginLeft = "18px";
    row1.appendChild(addBtn);
    panelEl.appendChild(row1);
    addPF(1, uf.wrap, { act: function () { uf.input.focus(); } });
    addPF(1, addBtn, { act: function () {
      var v = uf.input.value.replace(/^\s+|\s+$/g, "");
      if (!v) { toast("Type an image link first"); return; }
      if (customWalls.length >= MAX_CUSTOM_WALLS) { toast("Limit reached - delete a custom wallpaper first"); return; }
      preload(v, function () {
        var id = addCustomWall(nameFromUrl(v), v);
        saveWalls();
        wallId = null; setWallpaper(id, false);
        renderPanel(0, allWalls().length - 1);
      }, function () { toast("Couldn't load that image"); });
    } });

    // Row 2: actions
    var row2 = mk("div", "pRow");
    row2.style.top = "496px";
    var fileBtn = mkBtn("Choose file\u2026"), delBtn = mkBtn("Delete current"), closeBtn = mkBtn("Done");
    row2.appendChild(fileBtn); row2.appendChild(delBtn); row2.appendChild(closeBtn);
    panelEl.appendChild(row2);

    var fi = document.createElement("input");
    fi.type = "file"; fi.setAttribute("accept", "image/*"); fi.style.display = "none";
    panelEl.appendChild(fi);
    fi.onchange = function () {
      var f = fi.files && fi.files[0];
      if (!f) { return; }
      if (customWalls.length >= MAX_CUSTOM_WALLS) { toast("Limit reached - delete a custom wallpaper first"); return; }
      try {
        var rd = new FileReader();
        rd.onload = function () {
          var raw = rd.result, im = new Image();
          im.onload = function () {
            var out = raw;
            try {
              var s = Math.min(1, 1920 / im.width, 1080 / im.height), cv = document.createElement("canvas");
              cv.width = Math.max(1, Math.round(im.width * s)); cv.height = Math.max(1, Math.round(im.height * s));
              cv.getContext("2d").drawImage(im, 0, 0, cv.width, cv.height);
              out = cv.toDataURL("image/jpeg", 0.82);
            } catch (e1) { out = raw; }
            var id = addCustomWall(nameFromUrl(f.name), out);
            if (!saveWalls()) { toast("Added for this session only (too large to save)"); }
            wallId = null; setWallpaper(id, false);
            renderPanel(0, allWalls().length - 1);
          };
          im.onerror = function () { toast("Couldn't read that image"); };
          im.src = raw;
        };
        rd.onerror = function () { toast("Couldn't read that file"); };
        rd.readAsDataURL(f);
      } catch (e2) { toast("File selection isn't supported here"); }
    };
    addPF(2, fileBtn, { act: function () { try { fi.click(); } catch (e) { toast("File picker isn't available - use an image link"); } } });
    addPF(2, delBtn, { act: function () {
      var k, w = findWall(wallId);
      if (!w || !w.url) { toast("Only your own wallpapers can be deleted"); return; }
      for (k = 0; k < customWalls.length; k++) { if (customWalls[k].id === wallId) { customWalls.splice(k, 1); break; } }
      saveWalls();
      wallId = null; setWallpaper("d0", true);
      toast("Wallpaper deleted");
      renderPanel(0, 0);
    } });
    addPF(2, closeBtn, { act: closePanel });

    var note = mk("div", "pNote", "Tip: BLUE on the remote cycles wallpapers. TV browsers often can't open a file picker - an image link, or a path next to this page such as wallpapers/mine.jpg, always works.");
    note.style.top = "586px";
    panelEl.appendChild(note);
  }

  /* ----- App editor panel ----- */
  function addAppRow(scr, i) {
    var a = apps[i], row = mk("div", "arow"), nf = mkField(a.name, "Name", 400), uf = mkField(a.url, "https://\u2026", 640);
    nf.input.oninput = function () { a.name = nf.input.value; };
    uf.input.oninput = function () { a.url = uf.input.value; };
    var up = mkIcon("up"), dn = mkIcon("down"), dl = mkIcon("x");
    row.appendChild(nf.wrap); row.appendChild(uf.wrap); row.appendChild(up); row.appendChild(dn); row.appendChild(dl);
    scr.appendChild(row);
    var show = function () { ensureRowVisible(row); };
    addPF(i, nf.wrap, { act: function () { nf.input.focus(); }, onfocus: show });
    addPF(i, uf.wrap, { act: function () { uf.input.focus(); }, onfocus: show });
    addPF(i, up, { onfocus: show, act: function () {
      if (i > 0) { var t = apps[i - 1]; apps[i - 1] = apps[i]; apps[i] = t; renderPanel(i - 1, 2); }
    } });
    addPF(i, dn, { onfocus: show, act: function () {
      if (i < apps.length - 1) { var t = apps[i + 1]; apps[i + 1] = apps[i]; apps[i] = t; renderPanel(i + 1, 3); }
    } });
    addPF(i, dl, { onfocus: show, act: function () {
      if (apps.length <= 1) { toast("Keep at least one app"); return; }
      apps.splice(i, 1);
      renderPanel(Math.min(i, apps.length - 1), 0);
    } });
  }
  function buildAppsPanel() {
    panelEl.appendChild(mk("div", "pTitle", "Edit apps"));
    panelEl.appendChild(mk("div", "pSub", "Rename shortcuts and set their links. Highlight a field and press OK to type."));
    var body = mk("div", "pBody"), scr = mk("div", "pScroll"), i;
    body.appendChild(scr); panelEl.appendChild(body);
    P.scrollEl = scr; P.scrollY = 0;
    for (i = 0; i < apps.length; i++) { addAppRow(scr, i); }

    var foot = mk("div", "pFoot"), n = apps.length;
    var b1 = mkBtn("+ Add app"), b2 = mkBtn("Restore defaults"), b3 = mkBtn("Done");
    foot.appendChild(b1); foot.appendChild(b2); foot.appendChild(b3);
    panelEl.appendChild(foot);
    addPF(n, b1, { act: function () {
      if (apps.length >= MAX_APPS) { toast("Maximum of " + MAX_APPS + " apps"); return; }
      apps.push({ name: "New app", url: "https://", c: PALETTE[apps.length % PALETTE.length] });
      renderPanel(apps.length - 1, 0);
    } });
    addPF(n, b2, { act: function () { apps = cloneApps(); renderPanel(0, 0); toast("Default apps restored"); } });
    addPF(n, b3, { act: closePanel });
  }

  function renderPanel(r, c) {
    P.rows = []; P.editing = null; P.scrollY = 0;
    panelEl.innerHTML = "";
    if (P.kind === "wall") { buildWallPanel(); } else { buildAppsPanel(); }
    setPF(r, c);
    refreshTicks();
  }
  function openPanel(kind) {
    var i, l, start = 0;
    P.kind = kind; P.open = true; P.r = 0; P.c = 0;
    panelEl.className = "glass " + (kind === "wall" ? "p-wall" : "p-apps");
    panelLayer.className = "show";
    if (kind === "wall") {
      l = allWalls();
      for (i = 0; i < l.length; i++) { if (l[i].id === wallId) { start = i; } }
    }
    renderPanel(0, start);
  }
  function commitApps() {
    var i, a, clean = [];
    for (i = 0; i < apps.length; i++) {
      a = apps[i];
      a.name = (a.name || "").replace(/^\s+|\s+$/g, "") || "App";
      a.url = normUrl(a.url) || a.url;
      clean.push(a);
    }
    apps = clean;
    save("apps", apps);
    buildApps();
    if (cur.r === 1 && cur.i >= apps.length) { cur.i = apps.length - 1; }
    setFocus(cur.r, Math.min(cur.i, rows[cur.r].items.length - 1));
  }
  function closePanel() {
    if (P.editing) { P.editing.blur(); }
    if (P.kind === "apps") { commitApps(); }
    P.open = false;
    panelLayer.className = "";
  }
  function panelKey(k) {
    var f = pfAt(P.r, P.c);
    if (P.editing) {
      if (k === 13) { P.editing.blur(); return true; }
      if (k === 10009 || k === 27) { P.editing.blur(); return true; }
      if (k === 38 || k === 40) { P.editing.blur(); }
      else { return false; }          // let the browser type / move the caret
    }
    if (k === 37) { if (P.c > 0) { setPF(P.r, P.c - 1); } return true; }
    if (k === 39) { setPF(P.r, P.c + 1); return true; }
    if (k === 38) { if (P.r > 0) { setPF(P.r - 1, P.c); } return true; }
    if (k === 40) { setPF(P.r + 1, P.c); return true; }
    if (k === 13) { if (f && f.act) { f.act(); } return true; }
    if (k === 8 || k === 27 || k === 10009) { closePanel(); return true; }
    return false;
  }

  /* =====================================================================
     Keys (arrows, Enter, Back, colour buttons)
     ===================================================================== */
  document.onkeydown = function (e) {
    e = e || window.event;
    var k = e.keyCode, r = cur.r, i = cur.i, handled = true;

    if (launching) {
      if (k === 8 || k === 27 || k === 10009 || k === 13) { closeLaunch(); }
      if (e.preventDefault) { e.preventDefault(); }
      return false;
    }
    if (P.open) {
      handled = panelKey(k);
      if (handled && e.preventDefault) { e.preventDefault(); }
      return !handled;
    }

    if (k === 37) { if (i > 0) { setFocus(r, i - 1); } }
    else if (k === 39) { if (i < rows[r].items.length - 1) { setFocus(r, i + 1); } }
    else if (k === 38) { if (r > 0) { setFocus(r - 1, Math.min(rows[r - 1].idx, rows[r - 1].items.length - 1)); } }
    else if (k === 40) { if (r < rows.length - 1) { setFocus(r + 1, Math.min(rows[r + 1].idx, rows[r + 1].items.length - 1)); } }
    else if (k === 13) { activate(); }
    else if (k === 8 || k === 27 || k === 10009) { if (r !== 0 || i !== 0) { setFocus(0, 0); } }
    else if (k === 406 || k === 87) { nextWallpaper(); }          // BLUE / W
    else if (k === 404 || k === 69) { openPanel("apps"); }        // GREEN / E
    else if (k === 403 || k === 77) { openPanel("wall"); }        // RED / M
    else if (k === 405 || k === 70) { toggleFx(); }               // YELLOW / F
    else { handled = false; }

    if (handled && e.preventDefault) { e.preventDefault(); }
    return !handled;
  };
  launchEl.onclick = closeLaunch;

  // Samsung Tizen: ask the TV to deliver the colour keys to this page
  try {
    if (window.tizen && window.tizen.tvinputdevice) {
      window.tizen.tvinputdevice.registerKeyBatch(["ColorF0Red", "ColorF1Green", "ColorF2Yellow", "ColorF3Blue"]);
    }
  } catch (err) {}

  /* =====================================================================
     Go
     ===================================================================== */
  setWallpaper(load("wall", "d0"), true);
  paintHero(0);
  setFocus(0, 0);
  startHero();
  setTimeout(function () { stage.className = "ready"; }, 50);
})();
</script>
</body>
</html>
